<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Playlist Manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>&#9835; Playlist Manager</h1>
    <p class="subtitle">Doubly linked list in C &middot; REST API &middot; vanilla JS</p>
  </header>

  <main class="layout">
    <!-- LEFT: playlist -->
    <section class="panel playlist-panel">
      <div class="panel-head">
        <h2>Playlist</h2>
        <div class="stats">
          <span><strong id="stat-count">0</strong> songs</span>
          <span><strong id="stat-duration">00:00</strong> total</span>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search title or artist..." aria-label="Search songs">
        <button id="btn-reverse" title="Reverse the list in place (swaps prev/next pointers)">Reverse</button>
        <button id="btn-view-reverse" title="Show the list from the tail using prev pointers (does not change it)">View reversed</button>
        <select id="sort-by" aria-label="Sort by">
          <option value="title">Title</option>
          <option value="artist">Artist</option>
          <option value="duration">Duration</option>
        </select>
        <button id="btn-sort">Sort</button>
        <button id="btn-shuffle">Shuffle</button>
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
      </div>

      <div id="view-note" class="view-note" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Title</th><th>Artist</th><th>Time</th><th></th></tr>
          </thead>
          <tbody id="song-rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden></p>
      </div>
    </section>

    <!-- RIGHT: player + add form -->
    <aside class="side">
      <section class="panel now-playing">
        <h2>Now Playing</h2>
        <div class="disc" id="disc" aria-hidden="true">&#9835;</div>
        <div id="np-title" class="np-title">Nothing playing</div>
        <div id="np-artist" class="np-artist">&mdash;</div>
        <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="times"><span id="np-elapsed">0:00</span><span id="np-length">0:00</span></div>
        <div class="controls">
          <button id="btn-prev" aria-label="Previous">&#9198;</button>
          <button id="btn-play" class="primary" aria-label="Play or pause">&#9654;</button>
          <button id="btn-next" aria-label="Next">&#9197;</button>
          <button id="btn-repeat" aria-pressed="false" title="Repeat: wrap around at the ends">&#8635; Repeat</button>
        </div>
      </section>

      <section class="panel">
        <h2>Add a song</h2>
        <form id="add-form" autocomplete="off">
          <label>Title <input id="f-title" required maxlength="99"></label>
          <label>Artist <input id="f-artist" required maxlength="99"></label>
          <div class="row">
            <label>Minutes <input id="f-min" type="number" min="0" max="599" value="3" required></label>
            <label>Seconds <input id="f-sec" type="number" min="0" max="59" value="0" required></label>
          </div>
          <div class="row">
            <label>Insert
              <select id="f-at">
                <option value="end">At the end</option>
                <option value="start">At the start</option>
                <option value="position">At position...</option>
              </select>
            </label>
            <label id="pos-label" hidden>Position <input id="f-pos" type="number" min="1" value="1"></label>
          </div>
          <button type="submit" class="primary wide">Add song</button>
        </form>
      </section>
    </aside>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
